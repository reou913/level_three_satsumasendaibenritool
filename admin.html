<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>要望の管理｜薩摩川内くらしの便利帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F5F4; --surface: #FFFFFF; --field: #EEF2F1; --ink: #17201E; --sub: #62706C; --line: #DFE6E4;
    --accent: #0B8A7A; --accent-soft: #E3F4F1; --on-accent: #FFFFFF;
    --sos: #E03131; --sos-soft: #FFF0F0; --warn: #C05A00; --warn-soft: #FFF4E6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111615; --surface: #1A2120; --field: #232C2A; --ink: #EEF3F2; --sub: #97A6A2; --line: #2A3431;
      --accent: #3CC9B4; --accent-soft: #15302B; --on-accent: #06201C;
      --sos: #FF6B6B; --sos-soft: #3A1C1E; --warn: #FFA94D; --warn-soft: #33230F;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  .card { background: var(--surface); border-radius: 28px; padding: 22px 20px; margin-top: 16px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 900; }
  .sub { color: var(--sub); margin: 6px 0 0; font-size: .9375rem; }
  .back { font-size: .875rem; color: var(--sub); }
  form { display: grid; gap: 12px; margin-top: 16px; }
  label { font-weight: 700; font-size: .9375rem; display: block; margin-bottom: 4px; }
  input { width: 100%; border: 2px solid transparent; border-radius: 14px; background: var(--field); padding: 10px 14px; min-height: 48px; }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { border: none; border-radius: 999px; padding: 10px 18px; font-weight: 700; min-height: 44px; background: var(--field); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.danger { background: var(--sos-soft); color: var(--sos); }
  .btn.danger.armed { background: var(--sos); color: #fff; }
  .msg { padding: 12px 14px; border-radius: 14px; font-size: .9375rem; }
  .msg.ng { background: var(--sos-soft); }
  .msg.ok { background: var(--accent-soft); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tab { border: none; border-radius: 999px; padding: 6px 14px; background: var(--field); font-weight: 700; min-height: 40px; }
  .tab[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .tab .n { margin-left: 6px; opacity: .75; font-weight: 500; }
  ul.list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: .8125rem; color: var(--sub); align-items: center; }
  .badge { font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .item p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .empty { margin-top: 12px; padding: 16px; border-radius: 16px; background: var(--field); color: var(--sub); text-align: center; }
  .tip { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--warn-soft); font-size: .875rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 便利帳にもどる</a>

  <div class="card">
    <h1>要望の管理</h1>
    <p class="sub">確認待ちの要望を読んで、公開するか決めます。管理者として登録した人だけが使えます。</p>
    <div id="setup" class="msg ng" hidden></div>

    <form id="login" hidden>
      <div><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <div id="login-msg" class="msg ng" hidden></div>
      <button class="btn primary" type="submit">ログイン</button>
    </form>

    <div id="panel" hidden>
      <div class="bar" style="margin-top:14px">
        <span class="sub" id="who" style="margin:0"></span>
        <span style="display:flex;gap:8px"><button class="btn" id="reload" type="button">読みなおす</button><button class="btn" id="logout" type="button">ログアウト</button></span>
      </div>
      <div id="not-admin" class="msg ng" hidden style="margin-top:12px">このアカウントは管理者として登録されていません。README の「管理者を登録する」の手順を確認してください。</div>
      <div id="admin-area" hidden>
        <div class="tabs" id="tabs"></div>
        <div id="op-msg" class="msg" hidden style="margin-top:12px"></div>
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty" hidden></div>
        <p class="tip">公開する前に、名前・電話番号・住所など人がわかることや、だれかを傷つける内容が書かれていないか確かめてください。そういう投稿は「非公開」にするか、消してください。</p>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STATUS = { pending: "確認待ち", published: "公開", hidden: "非公開" };
  const cfg = window.APP_CONFIG || {};
  const keyLooksSecret = k => {
    if (/^sb_secret_/.test(k)) return true;
    try { return JSON.parse(atob(k.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role === "service_role"; } catch { return false; }
  };
  const setup = text => { $("#setup").hidden = false; $("#setup").textContent = text; };
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY) return setup("config.js に Supabase の設定がまだ書かれていません。");
  if (keyLooksSecret(cfg.SUPABASE_KEY)) return setup("config.js に service_role（secret）の鍵が書かれています。危険なので動かしていません。公開用の鍵（anon / publishable）に直してください。");
  if (!window.supabase) return setup("Supabase の読み込みに失敗しました。時間をおいて開き直してください。");

  const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
  let rows = [], tab = "pending";

  async function showPanel(session) {
    $("#login").hidden = true;
    $("#panel").hidden = false;
    $("#who").textContent = session.user.email + " でログイン中";
    const { data: isAdmin, error } = await db.rpc("is_admin");
    if (error || !isAdmin) { $("#not-admin").hidden = false; $("#admin-area").hidden = true; return; }
    $("#not-admin").hidden = true;
    $("#admin-area").hidden = false;
    await reload();
  }
  function showLogin() {
    $("#panel").hidden = true;
    $("#login").hidden = false;
  }
  async function reload() {
    const { data, error } = await db.from("requests").select("*").order("created_at", { ascending: false }).limit(500);
    if (error) { op("読み込めませんでした：" + error.message, false); return; }
    rows = data || [];
    render();
  }
  function op(text, ok) { const m = $("#op-msg"); m.hidden = false; m.className = "msg " + (ok ? "ok" : "ng"); m.textContent = text; }
  function render() {
    $("#tabs").innerHTML = Object.entries(STATUS).map(([k, l]) =>
      `<button type="button" class="tab" data-k="${k}" aria-pressed="${k === tab}">${l}<span class="n">${rows.filter(r => r.status === k).length}</span></button>`).join("");
    $("#tabs").querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { tab = b.dataset.k; render(); }));
    const list = rows.filter(r => r.status === tab);
    $("#list").innerHTML = list.map(r => {
      const btns = [];
      if (r.status !== "published") btns.push(`<button class="btn primary" data-act="published" data-id="${r.id}">公開する</button>`);
      if (r.status !== "hidden") btns.push(`<button class="btn" data-act="hidden" data-id="${r.id}">非公開にする</button>`);
      if (r.status !== "pending") btns.push(`<button class="btn" data-act="pending" data-id="${r.id}">確認待ちに戻す</button>`);
      btns.push(`<button class="btn danger" data-act="delete" data-id="${r.id}">消す</button>`);
      return `<li class="item"><div class="meta"><span class="badge">${esc(r.category)}</span><span>${esc(r.nickname || "ニックネームなし")}</span>
        <span>${esc(new Date(r.created_at).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" }))}</span><span>No.${r.id}</span></div>
        <p>${esc(r.body)}</p><div class="acts">${btns.join("")}</div></li>`;
    }).join("");
    $("#empty").hidden = list.length > 0;
    $("#empty").textContent = `${STATUS[tab]}の要望はありません。`;
    $("#list").querySelectorAll("button[data-act]").forEach(b => b.addEventListener("click", () => act(b)));
  }
  async function act(b) {
    const id = Number(b.dataset.id), a = b.dataset.act;
    if (a === "delete") {
      // 1回目で「本当に消す？」に変わり、もう一度押すと消える
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "もう一度押すと消えます"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "消す"; }, 4000); return; }
      const { error } = await db.from("requests").delete().eq("id", id);
      if (error) return op("消せませんでした：" + error.message, false);
      rows = rows.filter(r => r.id !== id); op(`No.${id} を消しました。`, true); return render();
    }
    const { error } = await db.from("requests").update({ status: a }).eq("id", id);
    if (error) return op("変更できませんでした：" + error.message, false);
    const r = rows.find(x => x.id === id); if (r) r.status = a;
    op(`No.${id} を「${STATUS[a]}」にしました。`, true);
    render();
  }

  $("#login").addEventListener("submit", async e => {
    e.preventDefault();
    const { data, error } = await db.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pw").value });
    if (error) { $("#login-msg").hidden = false; $("#login-msg").textContent = "ログインできませんでした。メールアドレスとパスワードを確かめてください。"; return; }
    $("#login-msg").hidden = true; $("#pw").value = "";
    showPanel(data.session);
  });
  $("#logout").addEventListener("click", async () => { await db.auth.signOut(); rows = []; showLogin(); });
  $("#reload").addEventListener("click", reload);

  db.auth.getSession().then(({ data }) => data.session ? showPanel(data.session) : showLogin());
})();
</script>
</body>
</html>
